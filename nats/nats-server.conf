# NATS Server configuration for this project.
#
# Two layers of security are enforced here, matching the assignment's
# "secure inter-service communication" requirement:
#   1. TLS on the client port - encrypts everything in transit between
#      User Service / Notification Service and the broker.
#   2. Username/password authentication - a service cannot connect at all
#      without valid credentials, which are supplied via environment
#      variables and templated in at container start (see docker-compose.yml).

listen: 0.0.0.0:4222

jetstream {
  store_dir: "/data/jetstream"
  max_mem_store: 256MB
  max_file_store: 2GB
}

tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file: "/etc/nats/certs/server-key.pem"
  ca_file: "/etc/nats/certs/ca.pem"
  verify: false
  timeout: 5
}

authorization {
  # $NATS_USER / $NATS_PASSWORD are substituted by docker-compose using the
  # values in .env - never hardcode credentials in this file.
  user: $NATS_USER
  password: $NATS_PASSWORD
}

# HTTP monitoring endpoint - useful for demoing "this is alive and healthy"
# during a live walkthrough. Not exposed outside the docker network.
http: 0.0.0.0:8222

max_payload: 1MB
