

listen: 0.0.0.0:4222

jetstream {
  store_dir: "/data/jetstream"
  max_mem_store: 256MB
  max_file_store: 2GB
}

tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file: "/etc/nats/certs/server-key.pem"
  ca_file: "/etc/nats/certs/ca.pem"
  verify: false
  timeout: 5
}

authorization {

  user: $NATS_USER
  password: $NATS_PASSWORD
}


http: 0.0.0.0:8222

max_payload: 1MB
